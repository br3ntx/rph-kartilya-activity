<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartilya Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rph.css">
</head>
<body>
<div id="stage">
  <header id="hdr">
    <div class="logo"><div class="k">K</div><span>KARTILYA SHOWDOWN</span></div>
    <div id="sec"></div>
    <div id="pills"></div>
    <button class="icon-btn" id="bScores" aria-label="Scoreboard" title="Scoreboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg></button>
    <button class="icon-btn" id="bMenu" aria-label="Jump to section" title="Jump to section"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="icon-btn" id="bFull" aria-label="Fullscreen" title="Fullscreen (F)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </header>
  <main id="main"></main>
  <footer id="ftr">
    <button class="nav" id="bPrev">← Back</button>
    <span id="prog"></span>
    <button class="nav next" id="bNext">Next →</button>
  </footer>
  <div id="toast"></div>
</div>
<script src="rph.js"></script>
</body>
</html>
