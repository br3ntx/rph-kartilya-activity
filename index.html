<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartilya Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rph.css">
</head>
<body>
<div id="stage">
  <header id="hdr">
    <div class="logo"><div class="k">K</div><span>KARTILYA SHOWDOWN</span></div>
    <div id="sec"></div>
    <div id="pills"></div>
    <div class="sound-control"><button class="icon-btn" id="bMusic" aria-label="Toggle music" title="Music (M)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button><input class="volume-slider" id="musicVolume" type="range" min="0" max="1" step="0.01" value="0.35" aria-label="Music volume" title="Music volume"></div>
    <div class="sound-control"><button class="icon-btn" id="bSfx" aria-label="Toggle sound effects" title="Sound effects (S)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button><input class="volume-slider" id="sfxVolume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Sound effects volume" title="Sound effects volume"></div>
    <button class="icon-btn" id="bScores" aria-label="Scoreboard" title="Scoreboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg></button>
    <button class="icon-btn" id="bMenu" aria-label="Jump to section" title="Jump to section"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="icon-btn" id="bFull" aria-label="Fullscreen" title="Fullscreen (F)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </header>
  <main id="main"></main>
  <footer id="ftr">
    <button class="nav" id="bPrev">← Back</button>
    <span id="prog"></span>
    <button class="nav next" id="bNext">Next →</button>
  </footer>
  <div id="toast"></div>
</div>
<script src="rph-sound.js"></script>
<script src="rph.js"></script>
</body>
</html>
